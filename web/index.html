<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <!-- SEO Basic -->
    <title>LulusASN – Platform Latihan Ujian Nasional (CPNS, BUMN, Kedinasan)</title>
    <meta name="description" content="Platform latihan ujian online untuk CPNS, BUMN, dan Kedinasan. Sistem gamifikasi, soal adaptif, dan pembahasan lengkap.">
    <meta name="keywords" content="CPNS, BUMN, Kedinasan, latihan soal, ujian online">

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- ✅ TAMBAHKAN: AdSense preconnect untuk faster ad loading -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">

    <!-- Theme Color (Neobrutalism black) -->
    <meta name="theme-color" content="#000000">

    <!-- Favicon (use base64 to avoid extra request) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>🎓</text></svg>">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>🎓</text></svg>">

    <!-- Open Graph (Social Share) -->
    <meta property="og:title" content="LulusASN – Platform Latihan Ujian">
    <meta property="og:description" content="Latihan soal CPNS, BUMN, Kedinasan dengan sistem gamifikasi">
    <meta property="og:type" content="website">

    <!-- ✅ AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707055103686235"
            crossorigin="anonymous"></script>

    <!-- Critical CSS (Inline untuk instant render) -->
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        html, body {
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Loading screen (sebelum Flutter hydrate) */
        #loading {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          z-index: 9999;
        }

        #loading-text {
          font-size: 48px;
          font-weight: 900;
          letter-spacing: -2px;
          margin-bottom: 16px;
        }

        #loading-spinner {
          width: 40px;
          height: 40px;
          border: 4px solid #000;
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        /* Hide loading setelah Flutter ready */
        .flutter-loaded #loading {
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s;
        }
    </style>

</head>
<body>
<!-- Loading Screen -->
<div id="loading">
    <div id="loading-text">LULUSASN</div>
    <div id="loading-spinner"></div>
</div>

<!-- Flutter App Container -->
<div id="app-container"></div>

<!-- Flutter Bootstrap Script -->
<script>
    // Service Worker registration (for PWA & caching)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/flutter_service_worker.js');
      });
    }

    // Load Flutter Engine
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            // Use HTML renderer by default (lightest)
            renderer: "html",
          }).then(function(appRunner) {
            // Hide loading screen
            document.body.classList.add('flutter-loaded');

            // Start Flutter app
            appRunner.runApp();
          });
        }
      });
    });
</script>

<!-- Flutter Auto-inject Script -->
<script src="flutter.js" defer></script>
</body>
</html>
