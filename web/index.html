    <!-- ══════════════════════════════════════════════
         Critical CSS — inline untuk zero render-block
         Palette: Navy #0F172A | Gold #D4AF37 | White #FFFFFF
         Bg: #F8F9FC | Surface: #FFFFFF
    ══════════════════════════════════════════════ -->
    <style>
        *, *::before, *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --navy:   #0F172A;
          --navy2:  #1E293B;
          --gold:   #D4AF37;
          --gold2:  #F0D060;
          --white:  #FFFFFF;
          --bg:     #F8F9FC;
          --border: #E2E8F0;
          --text-secondary: #64748B;
        }

        html, body {
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: var(--bg);
          /* Plus Jakarta Sans via system stack — font load terjadi di Flutter */
          font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          text-rendering: optimizeLegibility;
        }

        /* ── Loading screen ─────────────────────────────── */
        #lz-loading {
          position: fixed;
          inset: 0;
          background: var(--white);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 32px;
          z-index: 9999;
          /* Safe area for notched devices */
          padding: env(safe-area-inset-top) env(safe-area-inset-right)
                   env(safe-area-inset-bottom) env(safe-area-inset-left);
          transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* ── Brand mark ─────────────────────────────────── */
        .lz-brand {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }

        .lz-logo-wrap {
          width: 64px;
          height: 64px;
          border-radius: 18px;
          background: linear-gradient(135deg, var(--navy), var(--navy2));
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 32px;
          line-height: 1;
          box-shadow: 0 8px 24px rgba(15,23,42,0.18);
        }

        .lz-wordmark {
          font-size: 28px;
          font-weight: 800;
          letter-spacing: -1px;
          color: var(--navy);
          line-height: 1;
        }

        .lz-wordmark span {
          /* Gold accent on last "z" */
          background: linear-gradient(90deg, var(--gold), var(--gold2));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .lz-tagline {
          font-size: 13px;
          font-weight: 500;
          color: var(--text-secondary);
          letter-spacing: 0.2px;
          text-align: center;
        }

        /* ── Gold accent bar ────────────────────────────── */
        .lz-gold-bar {
          width: 48px;
          height: 3px;
          border-radius: 999px;
          background: linear-gradient(90deg, var(--gold), var(--gold2));
        }

        /* ── Spinner — dual ring ────────────────────────── */
        .lz-spinner-wrap {
          position: relative;
          width: 44px;
          height: 44px;
        }

        .lz-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 3px solid transparent;
        }

        .lz-ring-outer {
          border-color: rgba(212, 175, 55, 0.25);
        }

        .lz-ring-inner {
          border-top-color: var(--navy);
          border-right-color: transparent;
          border-bottom-color: transparent;
          border-left-color: transparent;
          animation: lz-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes lz-spin {
          to { transform: rotate(360deg); }
        }

        /* ── Loading text ───────────────────────────────── */
        .lz-loading-label {
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1.5px;
          color: var(--text-secondary);
          text-transform: uppercase;
        }

        /* ── Hide state ─────────────────────────────────── */
        .flutter-loaded #lz-loading {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }

        /* ── Fade-in app ────────────────────────────────── */
        #app-container {
          width: 100%;
          height: 100%;
        }

        /* ── Noscript fallback ──────────────────────────── */
        .lz-noscript {
          position: fixed;
          inset: 0;
          background: var(--bg);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          padding: 32px;
          text-align: center;
          z-index: 99999;
        }

        .lz-noscript h1 {
          font-size: 20px;
          font-weight: 700;
          color: var(--navy);
        }

        .lz-noscript p {
          font-size: 14px;
          color: var(--text-secondary);
          max-width: 320px;
        }

        /* ── Reduced motion ─────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
          .lz-ring-inner { animation-duration: 1.5s; }
          #lz-loading { transition: none; }
        }
    </style>
</head>

<!-- ── Flutter App Container ─────────────────────── -->
<div id="app-container"></div>

<!-- ── Bootstrap Script ──────────────────────────── -->
<script>
    (function () {
      'use strict';

      // ── Service Worker (PWA + caching) ──────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/flutter_service_worker.js', { scope: '/' })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }

      // ── Flutter Engine Bootstrap ─────────────────────
      window.addEventListener('load', function () {
        var loader = window._flutter && window._flutter.loader;
        if (!loader) {
          console.error('[Luluzzz] flutter.js not loaded.');
          return;
        }

        loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: '{{flutter_service_worker_version}}',
          },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer
              .initializeEngine({
                renderer: 'canvaskit',         // CanvasKit — consistent rendering
                hostElement: document.getElementById('app-container'),
              })
              .then(function (appRunner) {
                // Hide splash with slight delay so Flutter paints first frame
                requestAnimationFrame(function () {
                  document.body.classList.add('flutter-loaded');
                });
                return appRunner.runApp();
              })
              .catch(function (err) {
                console.error('[Luluzzz] Engine init failed:', err);
              });
          },
        });
      });

      // ── Performance mark ─────────────────────────────
      if (window.performance && window.performance.mark) {
        window.performance.mark('luluzzz-html-parsed');
      }
    })();
</script>

<!-- Flutter bootstrap (defer = non-blocking) -->
<script src="flutter.js" defer></script>
